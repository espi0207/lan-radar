[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lan-radar"
version = "1.0.0"
description = "¿Quién está en mi wifi? Lista los aparatos de la red de casa con todo lo que cuentan de sí mismos: marca, modelo, nombre y servicios."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "espi0207" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.9"]

[project.scripts]
lan-radar = "lanradar.__main__:main"

[project.gui-scripts]
lan-radar-app = "lanradar.gui:main"

[tool.setuptools]
packages = ["lanradar"]

[tool.setuptools.package-data]
lanradar = ["icon.png", "data/oui.txt.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Cada sistema cuenta su red a su manera (ip, ifconfig, ipconfig), así que se prueba en los tres.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Pruebas (pytest)
        if: runner.os != 'Linux'
        run: pytest -q
      - name: Pruebas (pytest, con una pantalla virtual para la ventana)
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq xvfb)
          xvfb-run -a pytest -q
      - name: La demo funciona
        run: lan-radar --demo
      - name: Ve las redes de la máquina
        run: lan-radar --redes || true # en la CI puede no haber ninguna red privada

  red-de-mentira:
    # La prueba de verdad: una red de casa de mentira con nueve aparatos (router, iPhone,
    # Chromecast, impresora, PC con Windows…), cada uno en su "namespace" de Linux con su IP
    # y su MAC, y lan-radar revisándola con paquetes de verdad (ARP, mDNS, SSDP, NetBIOS, TCP).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Red de mentira y pasada de lan-radar
        run: |
          # Docker deja el reenvío entre puentes en DROP; para esta red de pruebas no hace falta filtrar nada.
          sudo sysctl -q -w net.bridge.bridge-nf-call-iptables=0 2>/dev/null || true
          sudo env "PATH=$PATH" LANRADAR_E2E=1 python -m pytest -v tests/test_e2e.py
